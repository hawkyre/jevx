name: Check release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: jevx-release
          path: .output/*.zip
